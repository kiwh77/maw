name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: CGO_ENABLED=0 go test ./...

      - name: Build binaries
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          targets=(
            "darwin amd64"
            "darwin arm64"
            "linux amd64"
            "linux arm64"
            "windows amd64"
            "windows arm64"
          )
          for t in "${targets[@]}"; do
            set -- $t
            os=$1 arch=$2
            ext=""
            [[ "$os" == windows ]] && ext=".exe"
            out="dist/maw_${ver}_${os}_${arch}${ext}"
            echo "Building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w -X github.com/kiwh77/maw/internal/version.Version=${ver}" \
              -o "$out" ./cmd/maw
          done
          (
            cd dist
            for f in maw_*; do
              if [[ "$f" == *.exe ]]; then
                zip -9 "${f%.exe}.zip" "$f"
                rm -f "$f"
              else
                tar -czf "${f}.tar.gz" "$f"
                rm -f "$f"
              fi
            done
            sha256sum *.tar.gz *.zip > checksums.txt
          )
          ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
