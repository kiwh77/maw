<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>maw global task board</title>
<meta name="color-scheme" content="dark light"/>
<script id="theme-init">
{{MAW_THEME_JS}}
</script>

<style>
{{MAW_STYLES}}
</style>
</head>
<body>
<div class="app" id="app-shell">
  <aside class="sidebar" id="app-shell-aside" aria-label="Projects & Agents">
    <div class="brand"><span class="brand-mark" aria-hidden="true">›_</span><div><div class="brand-name">maw<span style="color:var(--accent)">.</span></div><div class="brand-sub">AGENT WORKBENCH</div></div></div>
    <div class="section-label"><span id="workspace-label">Workspace</span> <span id="projects-count">00</span></div>
    <nav class="project-nav" id="project-nav" aria-label="工程导航"></nav>
    <section class="agents-rail" id="agents-rail" aria-label="Working Agents">
      <div class="section-label">AGENTS <span id="agents-count">0</span></div>
      <div class="agents-scroll" id="agents"><p class="empty">Loading…</p></div>
    </section>
    <div class="sidebar-foot"><span>⌘</span> multi-agent / worktree</div>
  </aside>
  <main class="workspace">
    <header class="topbar">
      <div class="breadcrumb"><span class="dim">Workspace</span><span class="slash">/</span><strong id="workspace-name">All projects</strong></div>
      <div class="topbar-tools"><div class="sub" id="subtitle" role="status">Connecting…</div><select id="lang-select" class="theme-select" aria-label="Language" title="Language"><option value="en">EN</option><option value="zh">中</option></select><select id="theme-select" class="theme-select" aria-label="Theme" title="Theme: follow system by default"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div>
    </header>
    <div class="content">
      <div class="page-heading">
        <div><div class="eyebrow">OPERATIONS / BOARD</div><h1 id="page-h1">Task board</h1><p class="page-description" id="page-desc">Track task flow and coordinate every Agent.</p></div>
        <button type="button" id="f-copy-join" class="join-button"><span class="symbol" aria-hidden="true">＋</span>Copy project join prompt</button>
      </div>
      <section class="stats" id="stats" aria-label="Task stats for current filters"></section>
      <div class="toolbar">
        <div class="filters" id="filters">
          <select id="f-project" aria-label="Project"><option value="">All projects</option></select>
          <select id="f-agent" aria-label="Agent"><option value="">All Agents</option></select>
          <select id="f-status" aria-label="Status"><option value="">All statuses</option></select>
          <button type="button" id="f-reset" class="quiet-button" title="Reset all filters">Reset</button>
        </div>
        <div class="toolbar-right">
          <div class="board-meta-left">
            <div class="view-toggle" id="view-toggle" role="group" aria-label="View switch">
              <button type="button" id="view-board" data-view="board" class="active" aria-pressed="true">Board</button>
              <button type="button" id="view-topo" data-view="topo" aria-pressed="false">Dependency topology</button>
            </div>
            <span id="board-count">Loading tasks…</span>
          </div>
          <label class="search-box"><span aria-hidden="true">⌕</span><input type="search" id="task-search" aria-label="Search tasks" placeholder="Search tasks, ids, owners…"/><kbd aria-hidden="true">/</kbd></label>
        </div>
      </div>
      <div class="board" id="columns" aria-label="Task flow"></div>
      <div class="topo" id="topology" aria-label="Task dependency topology" hidden></div>
      <div class="hint-center" id="hint-center"><div class="hint-next" id="next"><b>NEXT</b><span id="next-hint-text">Reading schedule hints…</span></div><div class="hint-risks empty" id="risks"></div></div>
    </div>
  </main>
</div>
<div class="drawer-mask" id="drawer-mask" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title" aria-hidden="true" inert>
  <div class="drawer-head"><div><div class="subid" id="d-id"></div><h2 id="d-title"></h2></div><button type="button" class="drawer-close" id="d-close" aria-label="Close detail">×</button></div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<script id="board-app">
{{MAW_APP_JS}}
</script>
<script id="board-web" src="assets/board-web.js" defer></script>
</body>
</html>
