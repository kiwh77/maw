[package]
name = "maw-desktop"
version = "0.1.0"
description = "maw board desktop shell (Tauri)"
authors = ["kiwh77"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
# 系统通知（VN-902）：桌面提醒是站内记录的附加渠道，权限被拒时站内提醒仍然成立。
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
